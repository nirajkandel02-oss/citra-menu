<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citra Menu</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
  .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain;
           opacity: 0; transition: opacity 0.8s ease; }
  .slide.on { opacity: 1; }
  video.slide { background: #000; }
  #msg { position: absolute; left: 0; right: 0; bottom: 4vh; text-align: center;
         color: #8a8a8a; font: 2.2vh/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="msg"></div>
<script>
(function () {
  // ---- Settings ----------------------------------------------------------
  var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTex9qCWM837UU0xAXrRlFh3zlZaS34HTVZMxKJX-4__cXyvNN8q-GTotVaXTqYuO8O-_N2RIC-wjE0/pub?gid=0&single=true&output=csv";
  var IMAGE_BASE = "https://nirajkandel02-oss.github.io/citra-menu/";
  var CHECK_EVERY_MS = 2 * 60 * 1000;     // look for sheet changes every 2 minutes
  var FULL_RELOAD_MS = 6 * 60 * 60 * 1000; // reload the whole page every 6 hours (picks up code updates)
  var DEFAULT_SECONDS = 15;                // used when a TV rotates images but seconds is 0 or empty

  // ---- Which TV is this? -------------------------------------------------
  var match = /[?&]screen=([^&#]*)/.exec(location.search);
  var SCREEN = match ? decodeURIComponent(match[1]).trim().toLowerCase() : "";
  var CACHE_KEY = "citra-menu:" + SCREEN;

  var stage = document.getElementById("stage");
  var msg = document.getElementById("msg");
  var current = "";      // JSON of the list now on screen
  var slides = [];
  var index = 0;
  var timer = null;

  function say(text) { msg.textContent = text || ""; }

  // ---- CSV parsing (handles quoted cells) --------------------------------
  function parseCSV(text) {
    var rows = [], row = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (c === '"') { q = false; }
        else { cell += c; }
      } else if (c === '"') { q = true; }
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); rows.push(row); row = []; cell = "";
      } else { cell += c; }
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  // Turn the sheet into this TV's list of images
  function listForThisScreen(text) {
    var rows = parseCSV(text);
    if (!rows.length) return null;
    var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
    var col = function (name) { return head.indexOf(name); };
    var cScreen = col("screen"), cImage = col("image"), cSec = col("seconds"),
        cShow = col("show"), cOrder = col("order"),
        cStart = col("start"), cEnd = col("end");
    if (cScreen < 0 || cImage < 0) return null; // not our sheet, ignore it

    var list = [];
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      var name = (row[cScreen] || "").trim().toLowerCase();
      var image = (row[cImage] || "").trim();
      var show = cShow < 0 ? true : (row[cShow] || "").trim().toUpperCase() === "TRUE";
      if (name !== SCREEN || !image || !show) continue;
      list.push({
        image: image,
        seconds: parseFloat(row[cSec]) || 0,
        order: parseFloat(row[cOrder]) || 0,
        start: cStart < 0 ? "" : (row[cStart] || "").trim(),
        end: cEnd < 0 ? "" : (row[cEnd] || "").trim()
      });
    }
    list.sort(function (a, b) { return a.order - b.order; });
    return list;
  }

  // ---- Time schedule ---------------------------------------------------
  // Turns "7:00", "07:00:00", "7 AM", "2:30 PM" or "14:30" into minutes after midnight
  function toMinutes(t) {
    var m = /^(\d{1,2})(?::(\d{2}))?(?::\d{2})?\s*(am|pm)?$/i.exec((t || "").trim());
    if (!m) return null;
    var h = parseInt(m[1], 10), min = parseInt(m[2] || "0", 10), ap = (m[3] || "").toLowerCase();
    if (ap === "pm" && h < 12) h += 12;
    if (ap === "am" && h === 12) h = 0;
    if (h > 24 || min > 59) return null;
    return h * 60 + min;
  }

  // Is this row allowed to show right now? Empty start/end means all day.
  function onNow(item) {
    var a = toMinutes(item.start), b = toMinutes(item.end);
    if (a === null && b === null) return true;
    var d = new Date(), now = d.getHours() * 60 + d.getMinutes();
    if (a === null) a = 0;
    if (b === null) b = 24 * 60;
    if (a <= b) return now >= a && now < b;   // e.g. 7:00 to 11:00
    return now >= a || now < b;               // overnight, e.g. 22:00 to 2:00
  }

  var allItems = null; // every row for this TV, before the time filter
  function refresh() {
    if (!allItems) return;
    show(allItems.filter(onNow).map(function (i) {
      return { image: i.image, seconds: i.seconds, order: i.order };
    }));
  }

  // ---- Showing images ----------------------------------------------------
  function show(list) {
    var key = JSON.stringify(list);
    if (key === current) return; // nothing changed
    current = key;
    clearTimeout(timer);

    if (!list.length) {
      stage.innerHTML = "";
      slides = [];
      say("No menu is set for " + SCREEN + " right now. Check the sheet: show, start and end.");
      return;
    }

    var fresh = [];
    var loaded = 0, finished = 0;
    var single = list.length === 1;
    list.forEach(function (item) {
      var src = IMAGE_BASE + item.image.replace(/^\/+/, "");
      var el, settled = false;
      function ok() { if (settled) return; settled = true; loaded++; done(); }
      function bad() { if (settled) return; settled = true; el.dataset.bad = "1"; done(); }
      if (/\.(mp4|webm|mov|m4v)$/i.test(item.image)) {
        // Video: muted so the TV is allowed to autoplay it
        el = document.createElement("video");
        el.muted = true;
        el.setAttribute("muted", "");
        el.setAttribute("playsinline", "");
        el.preload = "auto";
        el.loop = single; // one video on this TV: loop it forever
        el.addEventListener("loadeddata", ok);
        el.addEventListener("error", bad);
        el.src = src;
        el.load();
      } else {
        el = new Image();
        el.alt = "";
        el.onload = ok;
        el.onerror = bad;
        el.src = src;
      }
      el.className = "slide";
      el.dataset.seconds = item.seconds;
      fresh.push(el);
    });

    function done() {
      finished++;
      if (finished < fresh.length) return;
      var good = fresh.filter(function (img) { return !img.dataset.bad; });
      if (!good.length) {
        // Keep whatever was showing before; try again on the next check
        current = "";
        if (!slides.length) say("Can't load the menu images for " + SCREEN + ". Check the file names in the sheet.");
        return;
      }
      say("");
      slides.forEach(deactivate); // stop the old menu before swapping
      stage.innerHTML = "";
      good.forEach(function (img) { stage.appendChild(img); });
      slides = good;
      index = 0;
      activate(slides[0]);
      next();
    }
  }

  function isVideo(el) { return el.tagName === "VIDEO"; }

  function activate(el) {
    el.classList.add("on");
    if (isVideo(el)) {
      try { el.currentTime = 0; } catch (e) {}
      var p = el.play();
      if (p && p.catch) p.catch(function () {});
    }
  }

  function deactivate(el) {
    el.classList.remove("on");
    if (isVideo(el)) { el.pause(); el.onended = null; }
  }

  function advance() {
    deactivate(slides[index]);
    index = (index + 1) % slides.length;
    activate(slides[index]);
    next();
  }

  function next() {
    if (slides.length < 2) return;
    var el = slides[index];
    var secs = parseFloat(el.dataset.seconds) || 0;
    if (isVideo(el) && !secs) {
      // Video with seconds 0: play it to the end, then move on
      el.onended = advance;
      return;
    }
    timer = setTimeout(advance, (secs || DEFAULT_SECONDS) * 1000);
  }

  // ---- Load the sheet (with offline backup) ------------------------------
  function check() {
    fetch(CSV_URL + "&t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (text) {
        var list = listForThisScreen(text);
        if (!list) throw new Error("bad sheet");
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(list)); } catch (e) {}
        allItems = list;
        refresh();
      })
      .catch(function () {
        // No internet or Google hiccup: keep showing the last good menu
        if (!slides.length) {
          var saved = null;
          try { saved = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) {}
          if (saved) { allItems = saved; refresh(); } else say("Waiting for internet to load the menu.");
        }
      });
  }

  if (!SCREEN) {
    say("Add ?screen= and the TV's name to the end of this link, for example ?screen=bu-700-tv-1");
    return;
  }

  // Show the saved menu right away, then check the sheet
  try {
    var saved = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (saved) { allItems = saved; refresh(); }
  } catch (e) {}
  check();
  setInterval(check, CHECK_EVERY_MS);
  setInterval(refresh, 30 * 1000); // switch menus on time, even with no internet
  setInterval(function () {
    // Only reload if the page is reachable, so an internet outage never blanks the screen
    fetch(location.pathname + "?ping=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (r.ok) location.reload(); })
      .catch(function () {});
  }, FULL_RELOAD_MS);
})();
</script>
</body>
</html>
